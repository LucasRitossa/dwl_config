# dwl live settings, applied at startup and whenever you reload:
#
#   kill -HUP "$(pidof dwl)"     or     Super+Shift+F5
#
# Only settings that can change without restarting the compositor live here;
# bindings, layouts, rules, colours and borderpx stay in config.h and still
# need a rebuild (and a restart) to change.
#
# Missing keys fall back to the compiled config.h values. A malformed value is
# reported in ~/.local/state/dwl-run.log and the previous value is kept.

# Keyboard auto-repeat, the equivalent of X11's `xset r rate 300 50`.
repeat_rate  = 50
repeat_delay = 300

# Pointer acceleration (-1..1; libinput default is 0).
accel_speed  = 0.0
# flat or adaptive
accel_profile = adaptive

# Keyboard layout and options; omit to keep config.h's xkb_rules.
xkb_layout  = us
xkb_options = caps:escape
