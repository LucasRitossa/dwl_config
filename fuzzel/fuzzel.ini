# fuzzel - launcher for dwl (Super+D)
# Palette matches ~/.config/dwl_config/dwl/config.h and alacritty.toml:
#   bg 1D2021 / fg aaaaaa / accent 30b27a / border 282828

[main]
font=JetBrainsMono Nerd Font:size=12
dpi-aware=no
prompt=run:
icons-enabled=yes
icon-theme=Papirus-Dark
terminal=alacritty
lines=20
width=36
horizontal-pad=18
vertical-pad=10
inner-pad=8
layer=overlay
exit-on-keyboard-focus-loss=yes

[colors]
background=1d2021ff
text=aaaaaaff
match=30b27aff
selection=30b27aff
selection-text=1d2021ff
selection-match=1d2021ff
border=30b27aff

[border]
width=1
radius=0
