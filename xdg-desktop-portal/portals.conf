[preferred]
# dwl is a wlroots compositor, so screen sharing must go through
# xdg-desktop-portal-wlr. Its .portal file ships UseIn=wlroots;sway;Wayfire;river;
# phosh;Hyprland, which does not list "dwl", so with XDG_CURRENT_DESKTOP=dwl the
# ScreenCast interface had no backend at all and Discord showed an empty picker.
default=wlr;gtk
org.freedesktop.impl.portal.ScreenCast=wlr
org.freedesktop.impl.portal.Screenshot=wlr
